# inventory-dimensions.conf — 维度枚举注册表（WP-P2/M1）
# 数据驱动：inventory-verify.sh source 本文件，按项目形态选取适用维度做枚举计数核验。
# 字段（每维度一个 <ID>，全大写下划线）:
#   DIM_<ID>_TITLE   维度人读名
#   DIM_<ID>_FORMS   适用项目形态（空格分隔）：backend frontend async desktop mobile lib common
#                    all = 全形态适用；common = 所有非纯库形态都适用
#   DIM_<ID>_CMD     枚举命令模板（含 ${PROJECT_DIR} 占位，inventory-verify.sh 替换后 eval）
#                    命令输出语义按 CMD 自定：find -print / grep -rl 每行一文件（按文件计数），
#                    grep -rhoE 每行一匹配（按出现次数计数，不去重）。脚本对输出行计数（grep -c .）。
#   DIM_<ID>_RM_REF  reference-manual.md 对应表锚（§<n> 或 §<n>.<sub>，空格分隔多锚取合计行数
#                    ——R33-D5：同维度在不同档位落不同节，如 ORM schema standard 在 §8 / lite 在 §9）
# 形态判定由 §C+.0 产出（exploration-guide.md）；脚本读生成产物 conf 的 PROJECT_FORM 变量，
#   不落产物时退化为全维度（与 spec §4 一致）。
# 红线：本表只定义「枚举什么 + 对照哪张表」，不替模型判断维度是否适用——适用判断由 §C+.0 形态判定驱动。
# 排除链（R23 回归 D5）：find 类用 -not -path、grep 类用 --exclude-dir，两条命令族都必须排除
# node_modules/dist/.git——npm install 后枚举扫进第三方包 = 计数爆炸假 FAIL（回归实证）。

DIM_FRONTEND_UI_TITLE='前端 UI 组件'
DIM_FRONTEND_UI_FORMS='frontend'
DIM_FRONTEND_UI_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*.vue' -o -name '*.svelte' -o -name '*.tsx' -o -name '*.jsx' \\) -not -path '*/node_modules/*' -not -path '*/dist/*'"
DIM_FRONTEND_UI_RM_REF='§4'

DIM_BACKEND_CONTROLLER_TITLE='后端 controller'
DIM_BACKEND_CONTROLLER_FORMS='backend'
# R33-D2（2026-09-17 Java 栈执勤实证 r33-drill-inventory-api）：旧注解交替 `@(Get|Post|...|RequestMapping|Controller)`
# 无词边界——@Get 前缀误中 Lombok @Getter（@PostConstruct 同理），且类级 @RequestMapping/@Controller
# 非端点也被计数 → Java 枚举虚高 50%（实测 12 命中 vs 8 真实端点）→ 假 FAIL。
# 修：只数 Spring 专用映射注解（精确名 + \b）。类级 @RequestMapping 承载的项目会低估——
# 低估方向安全（清单≥枚举 capped 1.0 PASS + ENUM_ZERO_DIM 披露兜底），优于高估假 FAIL。
DIM_BACKEND_CONTROLLER_CMD="grep -rhoE 'router\\.(get|post|put|delete|patch|use|all)|@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping)\\b' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.java' --include='*.go' --include='*.py' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_BACKEND_CONTROLLER_RM_REF='§6'

DIM_STORE_TITLE='store / 状态管理'
DIM_STORE_FORMS='common'
DIM_STORE_CMD="grep -rlE 'defineStore|createStore|createSlice|useReducer|Provider.*value|@ngrx|pinia|zustand|jotai|recoil' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.tsx' --include='*.jsx' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_STORE_RM_REF='§9'

DIM_TYPEDEF_TITLE='类型定义'
DIM_TYPEDEF_FORMS='common'
DIM_TYPEDEF_CMD="grep -rlE '^export (interface|type) ' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.tsx' --include='*.d.ts' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_TYPEDEF_RM_REF='§9'

DIM_ASYNC_CONSUMER_TITLE='异步消费者 / handler'
DIM_ASYNC_CONSUMER_FORMS='async'
DIM_ASYNC_CONSUMER_CMD="grep -rlE '@KafkaListener|@RabbitListener|@StreamListener|@EventHandler|consume\\(|@Subscriber|def handle_|async def handle' \"\${PROJECT_DIR}\" --include='*.java' --include='*.ts' --include='*.js' --include='*.py' --include='*.go' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_ASYNC_CONSUMER_RM_REF='§6'

DIM_API_ENDPOINT_TITLE='接口端点'
DIM_API_ENDPOINT_FORMS='backend'
# R33-D3（2026-09-17 Java 栈执勤实证）：旧 Java 分支 `@(Get|Post|...)\\(` 要求注解名后紧跟括号，
# 但 Spring 实际注解形态是 @GetMapping(...)（Get 后面是 Mapping 不是括号）——该分支在任何
# Spring 项目上恒 0 命中（死正则），Java REST 项目端点维度整体失效（ENUM_ZERO_DIM 兜底披露）。
# 修：精确注解名 + \\b（裸 @GetMapping 无参形态也命中——路径继承类级 @RequestMapping 仍是端点）。
DIM_API_ENDPOINT_CMD="grep -rhoE '@(GetMapping|PostMapping|PutMapping|DeleteMapping|PatchMapping)\\b|[[:alnum:]_]*[Rr]outer\\.(get|post|put|delete|patch)\\([^)]*\\)|app\\.(get|post|put|delete|patch)\\(' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.java' --include='*.go' --include='*.py' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_API_ENDPOINT_RM_REF='§6'

DIM_LIB_EXPORT_TITLE='库导出'
DIM_LIB_EXPORT_FORMS='lib'
DIM_LIB_EXPORT_CMD="grep -rhE '^export ' \"\${PROJECT_DIR}\" --include='*.ts' --include='*.js' --include='*.py' --include='*.go' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git 2>/dev/null"
DIM_LIB_EXPORT_RM_REF='§4'

# R21-C 测试资产维度：测试文件也是一等清单对象（枚举计数 ↔ reference-manual 测试案例节勾稽）。
# 锚 §测试案例 = template-spec check §1 章节名（AI 填充按该名建节）；零测试项目自然 NO_LIST 不误报。
# 检测模式与 assets/gates-warn.sh check_test 的探测镜像（两处注释互指，改一处须同步另一处）。
DIM_TESTFILES_TITLE='测试文件'
DIM_TESTFILES_FORMS='common'
DIM_TESTFILES_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*test*.py' -o -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*Test.java' -o -name '*_test.go' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*'"
DIM_TESTFILES_RM_REF='§测试案例'

# 数据映射三维度（漏改字段防线：字符串耦合点须进清单与计数核验，与 relations-extract
# 的 mapper-binding/data-mapping 边互为表里——清单给人读，边集给脚本查）。
# 检测模式与 relations-extract.sh 的 mapper XML 提取、exploration-guide §C+.1-FW
# mybatis/spring-batch/quartz 枚举段呼应（改一处须同步另一处）。
# 零数据层/零任务项目自然 NO_LIST 不误报；Java 项目须含 -not -path '*/target/*'
# （构建产物复制 XML = 计数膨胀假 FAIL，R23 排除链同源教训）。
DIM_DATA_MODEL_TITLE='数据模型 / ORM 实体'
DIM_DATA_MODEL_FORMS='common'
# R28-DF2（2026-09-16 FastAPI 执勤实证 taskflow-api）：原模式覆盖 JPA/MyBatis-Plus/Mongo/
# Prisma/mongoose/sequelize，缺 SQLAlchemy 声明式（Python 生态最主流 ORM，__tablename__ 是
# DeclarativeBase 声明式的强特征）——fastapi+sqlalchemy 项目此维度必漏报 0。补 __tablename__=。
# R33-D4（2026-09-17 Java 栈执勤实证 r33-drill-inventory-api）：纯 MyBatis 实体（无 JPA/MP 注解）
# 恒 0 命中——补包约定形态（domain/entity/entities/model/po/pojo 包声明；dto/mapper/service 包
# 天然排除）。XML resultMap type= 反查因文件计数粒度错配（N 实体可能 1 个 XML）不采纳，以披露兜底。
DIM_DATA_MODEL_CMD="grep -rlE '@Entity\\b|@Table\\b|@TableName\\b|@Document\\b|BaseMapper<|Schema\\(|mongoose\\.|sequelize\\.define|__tablename__[[:space:]]*=|^model[[:space:]]+[A-Za-z].*\\{|package[[:space:]]+[A-Za-z0-9.]+\\.(domain|entity|entities|model|po|pojo);' \"\${PROJECT_DIR}\" --include='*.java' --include='*.py' --include='*.ts' --include='*.go' --include='*.prisma' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=target 2>/dev/null"
DIM_DATA_MODEL_RM_REF='§9'

DIM_MAPPER_XML_TITLE='MyBatis mapper XML（SQL 声明层）'
DIM_MAPPER_XML_FORMS='common'
DIM_MAPPER_XML_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*Mapper.xml' -o -name '*mapper.xml' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' -not -path '*/target/*'"
DIM_MAPPER_XML_RM_REF='§9'

DIM_SCHEDULE_JOB_TITLE='定时 / 批处理任务（job 入口）'
DIM_SCHEDULE_JOB_FORMS='common'
DIM_SCHEDULE_JOB_CMD="grep -rlE '@Scheduled\\b|@EnableScheduling\\b|@EnableBatchProcessing\\b|@DisallowConcurrentExecution\\b|JobDetail\\b|CronTrigger\\b|JobBuilder\\b|StepBuilder\\b|ItemReader\\b|ItemWriter\\b|ItemProcessor\\b|tasklet\\(|beat_schedule|@XxlJob\\b|ElasticJob' \"\${PROJECT_DIR}\" --include='*.java' --include='*.py' --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=target 2>/dev/null"
DIM_SCHEDULE_JOB_RM_REF='§5'

# ORM schema/迁移资产（横向清剿轮：模型↔迁移漂移是漏改字段的姊妹缺陷——改实体/模型
# 不生成迁移，表结构与代码漂移，运行期才炸。schema/迁移文件必须进 §8 数据字典清单）。
# 覆盖：prisma schema / Django app migrations / alembic / flyway / liquibase changelog /
# TypeORM-sequelize migrations / JPA orm.xml / hibernate hbm.xml / schema*.sql。
DIM_ORM_SCHEMA_TITLE='ORM schema / 迁移资产'
DIM_ORM_SCHEMA_FORMS='common'
DIM_ORM_SCHEMA_CMD="find \"\${PROJECT_DIR}\" -type f \\( -name '*.prisma' -o -name 'orm.xml' -o -name '*.hbm.xml' -o -name 'schema*.sql' -o -name 'V[0-9]*__*.sql' -o -path '*/migrations/*' -o -path '*/alembic/versions/*' -o -path '*/db/migration/*' -o -path '*/db/changelog*' \\) -not -path '*/node_modules/*' -not -path '*/dist/*' -not -path '*/.git/*' -not -path '*/target/*' -not -path '*/.venv/*' -not -path '*/venv/*'"
# R33-D5（2026-09-17 Java 栈执勤实证）：lite 档 reference-manual 精简为 §4/§6/§9 三节（无 §8 数据字典），
# 单锚 §8 在 lite 档恒 NO_LIST——模型↔迁移漂移防线在 lite 档失效。RM_REF 支持空格分隔多锚：
# standard/compliance 档登记 §8（数据字典）、lite 档自然登记 §9（数据勾稽），两档皆可核验。
DIM_ORM_SCHEMA_RM_REF='§8 §9'
