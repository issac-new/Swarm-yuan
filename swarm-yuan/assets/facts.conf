#   fix commit 7d3f1879 "single version oracle" 在 v13.12.0..v13.12.2 范围内。
#   本地 ~/.claude-mem 数据目录可能显示旧版本标记（pre-12.4.3），那是环境安装版本，
#   非上游引用版本——research/claude-mem 仓库已对齐 v13.12.4（含 v13.12.1 fix）。
# self-check.sh G10 断言：扫描 swarm-yuan 自身脚本，发现按 mtime 选候选的可疑路径则 warn。
# 1=启用扫描（默认）；0=关闭。
FACT_VERSION_ORACLE_RULE=1              # 版本 oracle 单源规则存在标志（G10 读此开关）

# ===== 标记沿调用链传播（决策 28，G16，Palantir markings-propagate 映射）=====
# R11 调研（docs/research/R11-palantir-mapping.md §4.1）发现：稳定单元标注是
# file-glob 级静态属性，不沿调用链传播——`--stable-diff` 防直接改稳定单元，
# 防不了"改下游依赖间接破坏契约"。决策 28 扩展 `--stable-diff` 语义加传播段
# （下游改动只 warn 不 fail，保持 enforce_level 归类不变），不新增 check_* 门禁
# （守决策 26：门禁预算 54 不变）。G16 断言守 absorb 四载体一致性，不计入 54
# （决策 27 第 4 条：G<N> 是合规扩展点）。
FACT_STABLE_PROPAGATE=1                 # 1=启用标记沿调用链传播（决策 28）；0=关闭（仅直接改稳定单元 fail）
FACT_STABLE_PROPAGATE_HOPS=1            # 传播跳数（默认 1，仅 1 跳下游邻域；0=禁用传播段）
