# offline-manifest.conf — 离线安装包运行时清单（make-offline-bundle.sh 消费）
# 格式：runtime|channel|spec|note（channel ∈ npm|pip|github）
# 版本口径源：docs/upstream-baseline.md（21 行登记表）；通道陷阱三条已核：
#   ① graphify 的 npm 同名包是异源旧分支（0.10.0，2026-06-06）——R89 第五次诱取实录，禁用 npm 通道走 PyPI；
#   ② gsd-core 裸名 npm 是无关占位包（0.0.1）——须用 @opengsd/ 域名包；
#   ③ claude-mem npm 通道滞后 GitHub（npm latest 13.24.5 vs GitHub 13.34.2）——可装，适配层后端可替换。
# github 通道行不入 vendor（源码仓不可免源分发）——离线不可得，技能按诚实降级链运行（见 capability-map §三）。
# npm 滞后于 GitHub 基线的行在 note 标注；离线机有内部镜像源时可自行补装更新版。
openspec|npm|@fission-ai/openspec@1.14.1|CLI 运行时：spec proposal/tasks 格式（npm=基线）
codex-security|npm|@openai/codex-security@0.2.0|CLI 运行时：安全扫描门禁子进程（npm=基线）
ocr|npm|@alibaba-group/open-code-review@1.12.13|深度运行时：⑥测试 5 维审查（npm=基线）
claude-mem|npm|claude-mem@13.24.5|深度运行时：记忆后端之一（npm 滞后 GitHub 13.34.2；经 memory-backends.sh 适配层接入，local 后端可替代）
gsd-core|npm|@opengsd/gsd-core@1.14.0|CLI 运行时：计划验证/STATE 戳（npm 滞后 GitHub 1.16.0）
graphify|pip|graphifyy==0.9.80|深度运行时：代码图谱默认推荐（v8 线；PyPI 包名 graphifyy 双 y——裸名 graphify 无版本为占位；npm 同名异源禁用——通道陷阱①；本机 dist-info 实证 2026-10-09）
gitnexus|npm|gitnexus@1.6.9|深度运行时：图谱备选（PolyForm 非商用——用户指令豁免版权考量；npm 滞后 GitHub 1.6.12）
claude-code-host|npm|@anthropic-ai/claude-code@2.1.294|宿主 CLI（可选；Windows 原生支持）
codex-host|npm|@openai/codex@0.160.0|宿主 CLI（可选；npm 实测版，git 基线 0.161.0 滞后一版）
comet|github|-|CLI 运行时：工作流仪式（无可靠 npm 通道；离线不可得→降级 state-machine.sh）
superpowers|github|-|方法论运行时：纯文档引用（无需安装）
gstack|github|-|方法论运行时：纯文档引用（无需安装）
