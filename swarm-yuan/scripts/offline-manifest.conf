# offline-manifest.conf — 离线安装包运行时清单（make-offline-bundle.sh 消费）
# 格式：runtime|channel|spec|note（channel ∈ npm|pip|github）
# 版本口径源：docs/upstream-baseline.md（21 行登记表）；通道陷阱三条已核：
#   ① graphify 的 npm 同名包是异源旧分支（0.10.0，2026-06-06）——R89 第五次诱取实录，禁用 npm 通道走 PyPI；
#   ② gsd-core 裸名 npm 是无关占位包（0.0.1）——须用 @opengsd/ 域名包；
#   ③ claude-mem npm 通道曾长期滞后 GitHub——2026-10-15 R113 后复测已同步（13.39.0=GitHub 基线），适配层保留（后端可替换）。
# github 通道行不入 vendor（源码仓不可免源分发）——离线不可得，技能按诚实降级链运行（见 capability-map §三）。
# npm 滞后于 GitHub 基线的行在 note 标注；离线机有内部镜像源时可自行补装更新版。
# 2026-10-15 三目标轮⑰复扫（R115）：九通道全量实核（npm view / PyPI json），全部追平 R115 基线；codex-security GitHub tag npm-v0.3.0（2026-10-14）已到位，R113 勘误「npm 超 GitHub 基线」差位归零。
# 2026-10-17 三目标轮⑱复扫（R117）：九通道全量实核（npm view / PyPI json 实测），openspec/codex-security/ocr/claude-mem/graphify/claude-code-host 六行追平 R117 基线；graphifyy PyPI 0.10.0→0.9.92 通道归位（R116 勘误闭环）；gsd-core/codex-host/gitnexus 三行零移动维持。
openspec|npm|@fission-ai/openspec@1.14.3|CLI 运行时：spec proposal/tasks 格式（npm=基线；R117 升 1.14.3 双通道同步）
codex-security|npm|@openai/codex-security@0.4.0|CLI 运行时：安全扫描门禁子进程（npm 0.4.0=GitHub 基线 npm-v0.4.0（R117 升），双通道同步）
ocr|npm|@alibaba-group/open-code-review@1.13.1|深度运行时：⑥测试 5 维审查（npm=基线；R117 升 1.13.1）
claude-mem|npm|claude-mem@13.40.0|深度运行时：记忆后端之一（R117：GitHub 基线 13.41.0 未上 npm，钉 registry 实有 13.40.0（latest dist-tag 又滞后在 13.39.0——通道陷阱③复现）；经 memory-backends.sh 适配层接入，local 后端可替代）
gsd-core|npm|@opengsd/gsd-core@1.17.0|CLI 运行时：计划验证/STATE 戳（npm 已同步 GitHub 1.17.0）
graphify|pip|graphifyy==0.9.92|深度运行时：代码图谱默认推荐（v8 线；PyPI 包名 graphifyy 双 y——裸名 graphify 无版本为占位；npm 同名异源禁用——通道陷阱①；R117：PyPI 0.10.0→0.9.92 归位与 GitHub 同版，通道异常解除）
gitnexus|npm|gitnexus@1.6.12|深度运行时：图谱备选（PolyForm 非商用——用户指令豁免版权考量；npm 已同步 GitHub 1.6.12）
claude-code-host|npm|@anthropic-ai/claude-code@2.1.302|宿主 CLI（可选；Windows 原生支持；R117 随基线 2.1.302）
codex-host|npm|@openai/codex@0.163.0|宿主 CLI（可选；npm 已同步 git 基线 rust-v0.163.0；R116 随基线升级）
comet|github|-|CLI 运行时：工作流仪式（无可靠 npm 通道；离线不可得→降级 state-machine.sh）
superpowers|github|-|方法论运行时：纯文档引用（无需安装）
